<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barkoder.com</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" type="text/javascript"></script>
    <script>window.jQuery || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"><\/script>');</script>
    <script type="text/javascript" src="barkoderWasm/barkoder-umd.js"></script>

</head>

<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-3xl mx-auto p-6">
        <div class="flex items-center justify-between mb-6">
            <div>
                <a href="index.html" class="text-sm text-indigo-600 hover:underline">← Volver</a>
                <h1 class="text-2xl font-bold mt-2">Escáner PDF417 — Licencias</h1>
                <p class="text-sm text-gray-500 mt-1">Usa tu cámara para leer código PDF417. Ejecuta esto desde <span class="font-medium">http://localhost</span>.</p>
            </div>
            <div class="text-right">
                <div id="status" class="text-sm text-gray-600">Estado: <span class="font-semibold text-yellow-600">Inicializando...</span></div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <div id="barkoder-frame" class="w-full bg-black rounded-lg overflow-hidden flex items-center justify-center" style="height:320px;">
                        <div id="barkoder-container" class="w-full h-full"></div>
                        <div id="camera-overlay" class="absolute pointer-events-none"></div>
                    </div>
                </div>

                <div class="md:col-span-1 flex flex-col gap-3">
                    <div class="space-y-2">
                        <button id="start-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded">Iniciar Escaneo</button>
                        <button id="stop-btn" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 py-2 rounded">Detener</button>
                        <button id="restart-btn" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded">Reiniciar</button>
                    </div>

                    <div class="bg-gray-50 border border-gray-200 rounded p-3">
                        <h3 class="text-sm font-medium text-gray-700">Resultado</h3>
                        <div id="license-result" class="mt-2 text-lg font-semibold text-indigo-700">— Esperando —</div>
                    </div>

                </div>
            </div>
        </div>

        <footer class="text-center text-gray-400 text-sm mt-6">Barkoder Web SDK • PDF417</footer>
    </div>

    <script>
        // UI helpers
        function setStatus(text, colorClass) {
            $('#status > span').text(text).removeClass('text-yellow-600 text-green-600 text-red-600').addClass(colorClass || 'text-yellow-600');
        }

        // Barkoder control variables
        var Barkoder = null;
        var scanCallback = null;
        var started = false;

        // Initialize SDK and attach controls
        async function initBarkoder() {
            try {
                var BarkoderSDK = window.BarkoderSDK;
                if (!BarkoderSDK) throw new Error('Barkoder SDK not loaded.');
                Barkoder = await BarkoderSDK.initialize('PEmBIohr9EZXgCkySoetbwP4gvOfMcGzgxKPL2X6uqPSaiOA56KejR4lihaKiwhXE14lCGoY9GXF7G6aUT6-o7ByFtm45Ch3hDCWNgLJMtairfwHxN4HF1nyiD-cG-Tv1yp3-kRgHlavYStEYAKpG9gbTU-49gqrFFM31_zivLAY_DOF8a8oY5LgtApqW9b3vW3uPnxuNrH_-W5eeMq89E87XKik5fk1FbWdknkdn4iCtpSJgBKKs7E-oqm1XTGY7LkoEUgsH_GcpjjQD5S8OencJYlsojZaxI3sO3_KMYjapYyBzuCZBxxYLjfI-LA2GMdeftu1ef6zOSlST035Bg..');

                Barkoder.setEnabledDecoders(Barkoder.constants.Decoders.PDF417);
                // prefer faster, lower-resolution settings for realtime performance
                Barkoder.setCameraResolution(Barkoder.constants.CameraResolution.HD);
                Barkoder.setDecodingSpeed(Barkoder.constants.DecodingSpeed.Fast);
                Barkoder.setContainerOptions({ width: 640, height: 360, overrideSize: false, useFallbackSize: true });
                // performance tuning
                if (typeof Barkoder.setMaximumResultsCount === 'function') Barkoder.setMaximumResultsCount(1);
                if (typeof Barkoder.setContinuous === 'function') Barkoder.setContinuous(false);
                if (typeof Barkoder.setDuplicatesDelayMs === 'function') Barkoder.setDuplicatesDelayMs(500);

                $('#barkoder-container').css({ width: '100%', height: '100%' });

                setStatus('Listo', 'text-green-600');


                // helper: try to extract a license/id from SDK result
                function extractLicenseFromResult(r) {
                    // prefer formattedJSON if present
                    if (r.formattedJSON) {
                        try {
                            var obj = JSON.parse(r.formattedJSON);
                        } catch (e) { obj = null; }
                        if (obj) {
                            // try obvious key names first
                            var keys = Object.keys(obj || {});
                            for (var i = 0; i < keys.length; i++) {
                                var k = keys[i];
                                if (/licen|license|licencia|doc|id|numero|number|dni|dl/i.test(k)) {
                                    var v = obj[k];
                                    if (typeof v === 'string' && v.trim().length > 0) return v.trim();
                                    if (typeof v === 'number') return String(v);
                                }
                            }
                            // deep search for first string-like value
                            function deepFind(o) {
                                if (typeof o === 'string' && o.trim().length > 0) return o.trim();
                                if (typeof o === 'number') return String(o);
                                if (typeof o === 'object' && o !== null) {
                                    for (var kk in o) {
                                        if (Object.prototype.hasOwnProperty.call(o, kk)) {
                                            var res = deepFind(o[kk]); if (res) return res;
                                        }
                                    }
                                }
                                return null;
                            }
                            var found = deepFind(obj);
                            if (found) return found;
                        }
                    }

                    // fallback to formattedText / textualData
                    var text = r.formattedText || r.textualData || (r.results && r.results[0] && (r.results[0].textualData || r.results[0].formattedText)) || '';
                    if (text) {
                        // simple heuristic: find the longest alphanumeric token of reasonable length
                        var tokens = text.split(/\s|,|\n|\t|:|;/).map(t => t.trim()).filter(Boolean);
                        tokens.sort(function (a, b) { return b.length - a.length; });
                        for (var j = 0; j < tokens.length; j++) {
                            var t = tokens[j];
                            if (/[A-Za-z0-9\-]{4,30}/.test(t)) {

                                var idxDAQ = t.indexOf('DAQ');;
                                if (idxDAQ >= 0) {
                                    var daqCode = t.split('DAQ')[1].trim();
                                    if (daqCode.length > 0) return daqCode;
                                }
                                
                                return t;
                            }
                        }
                        text = text.trim();
                        var idxDAQ = text.indexOf('DAQ');;
                        if (idxDAQ >= 0) {
                            var daqCode = text.split('DAQ')[1].trim();
                            if (daqCode.length > 0) return daqCode;
                        }
                        return text;
                    }
                    return null;
                }

                // define scan callback
                scanCallback = function (r) {
                    try {
                        var count = r.resultsCount ?? r.results?.length ?? 0;
                        if (count > 0) {
                            console.log('result: ', r);
                            var license = extractLicenseFromResult(r);
                            if (license) {
                                $('#license-result').text(license);
                                // stop camera
                                try { Barkoder.stopScanner(); } catch (e) { }
                                started = false;
                                setStatus('Detectado', 'text-green-600');
                            } else {
                                // nothing extracted, show generic message
                                $('#license-result').text('Resultado recibido (no se pudo extraer licencia)');
                                setStatus('Detectado', 'text-green-600');
                            }
                        }
                    } catch (e) { console.error(e); }
                };

            } catch (e) {
                console.error(e);
                setStatus('Error', 'text-red-600');
                $('#license-result').text('Error inicializando SDK. Mira la consola.');
            }
        }

        // Controls
        $(document).ready(function () {
            // init SDK
            initBarkoder();

            $('#start-btn').on('click', function () {
                if (!Barkoder) { alert('SDK no inicializado'); return; }
                if (started) { setStatus('Escaneando', 'text-yellow-600'); return; }
                try {
                    Barkoder.startScanner(scanCallback);
                    started = true;
                    setStatus('Escaneando', 'text-yellow-600');
                    $('#license-result').text('— Escaneando —');
                } catch (e) { console.error(e); setStatus('Error', 'text-red-600'); }
            });

            $('#stop-btn').on('click', function () {
                if (Barkoder) { Barkoder.stopScanner(); started = false; setStatus('Detenido', 'text-red-600'); }
            });

            $('#restart-btn').on('click', function () {
                if (Barkoder) {
                    try { Barkoder.stopScanner(); } catch (e) { }
                    setTimeout(function () {
                        Barkoder.startScanner(scanCallback); started = true;
                        setStatus('Escaneando', 'text-yellow-600');
                        $('#license-result').text('— Escaneando —');

                    }, 300);
                }
            });
        });
    </script>
</body>

</html>
